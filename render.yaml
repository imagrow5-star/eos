# Render Blueprint — the hourly scheduler.
#
# The web service (eoscompanion.com, `eos-oug8.onrender.com`) was created by
# hand in the Render dashboard and is deliberately NOT described here: a
# Blueprint only manages services it created, and listing an existing one
# under the same name would make Render try to create a second copy. This
# file adds the one thing the dashboard does not have yet — the cron job
# that replaced the Replit Scheduled Deployment.
#
# What the job does, every hour on the hour (artifacts/daily-email/src/run.ts):
# it calls three of the api-server's internal sweep endpoints, in order —
# weekly chapters, weekly reflection, then stories (the daily Goals / Routines
# cards and the Sunday weekly story). The api-server decides who is inside
# their local window and every sweep is idempotent per (user, day/week), so an
# hourly cadence is safe. The job sends nothing to anyone: Eos has no outbound
# channel, no emails and no notifications. It never reads the database.
#
# Toolchain: this is a pnpm-10 workspace (catalog: and overrides live in
# pnpm-workspace.yaml, which pnpm 9 cannot read), so the build pins pnpm 10
# through npx rather than relying on runtime detection. Node 22 matches CI.
#
# Secrets: the one value marked `sync: false` is prompted for when the
# Blueprint is first applied and is stored in the env group, never in git.
# It MUST be identical to the web service's SESSION_SECRET — the internal
# endpoints verify an HMAC derived from it. Nothing else is shared.

services:
  - type: cron
    name: eos-hourly-sweeps
    runtime: node
    region: oregon            # same region as the web service
    plan: starter
    branch: main
    schedule: "0 * * * *"     # every hour on the hour, UTC
    buildCommand: npx --yes pnpm@10 install --frozen-lockfile && npx --yes pnpm@10 --filter @workspace/daily-email run build
    startCommand: node --enable-source-maps artifacts/daily-email/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://eoscompanion.com
      - fromGroup: eos-scheduler-secrets

envVarGroups:
  - name: eos-scheduler-secrets
    envVars:
      # Copy from the web service's Environment tab, byte for byte.
      - key: SESSION_SECRET
        sync: false
