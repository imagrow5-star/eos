<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Eos. A private place to say what you're feeling.</title>
    <meta name="description" content="Eos is a private place to think out loud, by voice or text, through a breakup, loneliness, or a heavy week. It remembers what matters to you. Your conversations are encrypted, never sold, and never used to train AI. Not therapy, and not a person." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Eos. A private place to say what you're feeling." />
    <meta property="og:description" content="Eos is a private place to think out loud, by voice or text, through a breakup, loneliness, or a heavy week. It remembers what matters to you. Your conversations are encrypted, never sold, and never used to train AI. Not therapy, and not a person." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eos. A private place to say what you're feeling." />
    <meta name="twitter:description" content="Eos is a private place to think out loud, by voice or text, through a breakup, loneliness, or a heavy week. It remembers what matters to you. Your conversations are encrypted, never sold, and never used to train AI. Not therapy, and not a person." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Calm cream default (sage, light); src/lib/theme.tsx re-points this after boot -->
    <meta name="theme-color" content="#FBF7EF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eos" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter 300 dropped: no font-light anywhere in the app.
         Fonts load NON-render-blocking via load-fonts.js (a plain stylesheet
         link here would hold first paint; the CSP forbids the inline-onload
         swap). display=swap paints text in the fallback immediately, then
         swaps. <noscript> keeps fonts for the (JS-required app's) rare no-JS
         probe / crawlers. -->
    <script src="load-fonts.js" data-href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:opsz,wght@14..32,400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,420;0,9..144,520;1,9..144,420&display=swap" defer></script>
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:opsz,wght@14..32,400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,420;0,9..144,520;1,9..144,420&display=swap" rel="stylesheet"></noscript>
    <!-- Paint the calm cream shell immediately: the app CSS arrives later, and
         without this slower devices show a stark white flash first.
         theme-init.js flips this to the dark shell pre-paint when the user
         chose dark mode. -->
    <style>html{background:#FBF7EF}</style>
    <!-- Pre-paint theme attribute stamp (external: CSP forbids inline JS) -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Old-browser guard. Deliberately ES5-only so it parses everywhere.
         Two layers:
           1. Feature-detect the floor the bundle needs; too old -> message.
           2. Watchdog: if the bundle didn't mount anything into #root within
              15s (failed download, runtime crash on an old engine), show the
              same message instead of a dead dark screen. -->
    <div id="browser-guard" hidden
         style="position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:#1B1512;padding:24px;text-align:center;font-family:Georgia,serif;color:#F3EADA">
      <div style="max-width:420px">
        <p style="font-size:22px;letter-spacing:.3em;margin-bottom:14px">E O S</p>
        <p style="font-size:15px;line-height:1.6;color:#7A5A52">
          Eos couldn&rsquo;t start in this browser. It may be out of date &mdash;
          please update it (or open this page in the latest Chrome or Safari)
          and try again.
        </p>
        <p style="font-size:12px;line-height:1.6;color:#977C6F;margin-top:14px">
          Still stuck? Write to hello@eoscompanion.com and we&rsquo;ll help.
        </p>
      </div>
    </div>
    <!-- External (not inline) so the production CSP's script-src 'self'
         allows it; plain non-module script so pre-ES2015 engines still run it. -->
    <script src="browser-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
